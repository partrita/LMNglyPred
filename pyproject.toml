    "pandas==1.5.0",
    "pillow>=12.2.0",
    "protobuf>=6.33.5",
    "requests>=2.32.4",
    "scikit_learn==1.2.0",
    "seaborn==0.11.2",
    "sentencepiece>=0.2.0",
    "tensorflow>=2.20.0,<2.21.0",
    "torch>=2.10.0",
    "tqdm==4.63.0",
    "transformers>=5.3.0",
    "urllib3>=2.7.0",
    "xgboost==1.5.0",
