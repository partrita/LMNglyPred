    "markdown>=3.8.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pillow>=12.3.0",
    "protobuf>=5.29.6,<6.0",
    "pyasn1>=0.6.4",
    "requests>=2.33.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "sentencepiece>=0.2.1",
    "setuptools>=83.0.0",
    "tensorflow>=2.20.0",
    "torch>=2.10.0",
    "tqdm>=4.66.3",
    "transformers>=5.5.0",
