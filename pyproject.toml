    "filelock>=4.2.4",
    "fonttools>=4.67.0",
    "idna>=3.20",
    "keras>=3.15.0",
    "markdown>=3.11.2",
    "matplotlib>=3.11.2",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pillow>=13.0.0",
    "protobuf>=5.29.6,<6.0",
    "pyasn1>=0.6.4",
    "requests>=2.34.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.0",
    "sentencepiece>=0.2.1",
    "setuptools>=84.2.1",
    "tensorflow>=2.20.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "urllib3>=2.8.0",
